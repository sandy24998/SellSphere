name: MERN CI Pipeline

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # 3️⃣ Backend (back-end folder)
      - name: Install backend dependencies
        working-directory: back-end
        run: npm ci

      - name: Run backend tests
        working-directory: back-end
        run: |
          if [ -f package.json ] && npm run | grep -q "test"; then
            npm test --if-present
          else
            echo "No backend tests found, skipping..."
          fi

      # 4️⃣ Frontend (front-end folder)
      - name: Install frontend dependencies
        working-directory: front-end
        run: npm ci

      - name: Build frontend
        working-directory: front-end
        run: npm run build --if-present

      - name: Run frontend tests
        working-directory: front-end
        run: |
          if [ -f package.json ] && npm run | grep -q "test"; then
            npm test --if-present -- --watchAll=false
          else
            echo "No frontend tests found, skipping..."
          fi

      # 5️⃣ Optional start script (sanity check)
      - name: Run start script
        run: |
          chmod +x ./start.sh
          ./start.sh || echo "Skipping runtime verification"

