name: MERN CI Pipeline

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Backend setup
      - name: Setup Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: back-end/package-lock.json

      - name: Install backend dependencies
        working-directory: back-end
        run: npm ci

      - name: Run backend tests
        working-directory: back-end
        run: |
          if [ -f package.json ] && npm run | grep -q "test"; then
            npx jest --ci
          else
            echo "No backend tests found, skipping..."
          fi

      # 3️⃣ Frontend setup
      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: front-end/package-lock.json

      - name: Install frontend dependencies
        working-directory: front-end
        run: npm ci

      - name: Build frontend
        working-directory: front-end
        run: npm run build --if-present

      - name: Run frontend tests
        working-directory: front-end
        run: |
          if [ -f package.json ] && npm run | grep -q "test"; then
            npx jest --ci --watchAll=false
          else
            echo "No frontend tests found, skipping..."
          fi

      # 4️⃣ Optional start script
      - name: Run start script
        run: |
          chmod +x ./start.sh
          ./start.sh || echo "Skipping runtime verification"

