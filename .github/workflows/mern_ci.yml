name: Deploy MERN App (Local WSL Runner)

on:
  push:
    branches:
      - 'feature/**'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create logs directory
        run: mkdir -p logs

      - name: Install PM2 globally
        run: npm install -g pm2

      - name: Install backend dependencies
        working-directory: ./back-end
        run: |
          npm ci
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" > .env
          echo "NODE_ENV=development" >> .env
          echo "PORT=5000" >> .env

      - name: Install frontend dependencies
        working-directory: ./front-end
        run: npm ci

      - name: Build frontend
        working-directory: ./front-end
        run: npm run build

      - name: Start or reload apps with PM2
        run: |
          pm2 delete all || true
          pm2 startOrReload ecosystem.config.js --update-env
          pm2 save

      - name: Wait for backend to start
        run: |
          for i in {1..10}; do
            curl -f http://localhost:5000/api && break || echo "Waiting for backend..." && sleep 5
          done
          curl -f http://localhost:5000/api

      - name: Wait for frontend to start
        run: |
          for i in {1..10}; do
            curl -f http://localhost:3000 && break || echo "Waiting for frontend..." && sleep 5
          done
          curl -f http://localhost:3000

      - name: Verify apps running
        run: pm2 list
