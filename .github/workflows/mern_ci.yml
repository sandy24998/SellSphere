name: MERN CI Pipeline

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Backend setup
      - name: Setup Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: back-end/package-lock.json

      - name: Install backend dependencies
        working-directory: back-end
        run: npm ci

      - name: Run backend tests (local MongoDB)
        working-directory: back-end
        env:
          MONGO_URI: mongodb://localhost:27017/SellAndBuy
          PORT: 5000
          NODE_ENV: test
        run: |
          echo "PORT=$PORT" > .env
          echo "MONGO_URI=$MONGO_URI" >> .env
          if [ -f package.json ] && npm run | grep -q "test"; then
            echo "🧪 Running backend tests..."
            npx jest --ci --detectOpenHandles --forceExit
          else
            echo "No backend tests found, skipping..."
          fi

      # 3️⃣ Frontend setup
      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: front-end/package-lock.json

      - name: Install frontend dependencies
        working-directory: front-end
        run: npm ci

      - name: Build frontend
        working-directory: front-end
        run: npm run build --if-present

      - name: Run frontend tests
        working-directory: front-end
        run: |
          if [ -f package.json ] && npm run | grep -q "test"; then
            echo "🧪 Running frontend tests..."
            npx jest --ci --watchAll=false
          else
            echo "No frontend tests found, skipping..."
          fi

      # 4️⃣ Optional start script
      - name: Verify app starts successfully (short check)
        working-directory: back-end
        env:
          MONGO_URI: mongodb://localhost:27017/SellAndBuy
          PORT: 5000
        run: |
          echo "🚀 Starting backend temporarily..."
          nohup node server.js > server.log 2>&1 &
          sleep 10
          if curl -s http://localhost:5000 > /dev/null; then
            echo "✅ Backend is up and responding!"
          else
            echo "❌ Backend failed to start"
            cat server.log
            exit 1
          fi

